# Configuration Docs:
#   - https://tmux.info/docs/configuration

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Reduce delay when pressing Escape in Vim
set -sg escape-time 5

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ============================================
# KEY BINDINGS
# ============================================

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position top

# ============================================
# PLUGINS (via TPM)
# ============================================

# NOTE: installing TPM is handled by the ./install script in my dotfiles folder

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

# Plugin settings
set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Los Angeles"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
