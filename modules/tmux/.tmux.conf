# Configuration Docs:
#   - https://tmux.info/docs/configuration

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 5

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# ============================================
# KEY BINDINGS
# ============================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# tmux-sessionizer
# Prefix + f opens the project picker.
# Alt bindings run TS_SESSION_COMMANDS by index in the active project session.
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r M-1 run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-2 run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-3 run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-4 run-shell "tmux neww tmux-sessionizer -s 3"

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position top

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Copy / Paste (currently testing against the below copy bindings)
bind [ copy-mode
bind -T vi-copy v begin-selection
bind -T vi-copy y copy-selection
bind -T vi-copy V rectangle-toggle
bind ] paste-buffer

# Choose paste buffer
bind Space choose-buffer

# Vi-style copy bindings
# bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy" # macos
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i" # linux

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# NOTE:
#       - Installing TPM is handled by the ./install script in my dotfiles folder.
#       - Rest of the plugin installations are handled by TPM itself

# Press leader+I to install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect' # restores tmux env after system restarts
set -g @plugin 'tmux-plugins/tmux-continuum' # auto-saves/auto-restores tmux env
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

# Plugin settings
set -g @resurrect-strategy-vim 'session' # save vim sessions
set -g @resurrect-strategy-nvim 'session' # save nvim sessions
set -g @resurrect-capture-pane-contents 'on'

set -g @continuum-restore 'off' # auto-restore tmux env
set -g @continuum-save-interval '10' # default: 15 min

set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Los Angeles"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
