onboarding = false

[theme]
name = "nord"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

### Keybindings
#
[keys]
prefix = "ctrl+b"

# Tabs: tmux window equivalents
new_tab = "prefix+c"            # Create a new tab
previous_tab = "prefix+p"       # Switch to previous tab
next_tab = "prefix+n"           # Switch to next tab
switch_tab = "prefix+1..9"      # Switch directly to tab 1-9
rename_tab = "prefix+comma"     # Rename current window
close_tab = "prefix+ampersand"  # Close current window

# Pane management: match tmux where practical
close_pane = "prefix+x"         # Close the current pane
zoom = "prefix+z"               # Toggle pane zoom
copy_mode = "prefix+["          # Enter copy mode
resize_mode = "prefix+r"        # Resize panes
cycle_pane_next = "prefix+o"    # Cycle focus to the next pane
cycle_pane_previous = "prefix+shift+o" # Cycle focus to the prev pane
last_pane = "prefix+;"          # Return to previously focused pane
rename_pane = "prefix+shift+p"  # Rename pane

# Pane navigation
# Vim-style directions instead of tmux's default arrow bindings
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Pane splitting: match tmux defaults
split_vertical = "prefix+%"       # Side-by-side split
split_horizontal = "prefix+\""    # Stacked split

# Workspace/session navigation
workspace_picker = "prefix+s"
settings = "prefix+shift+s"     # Open settings
detach = "prefix+d"             # Detach from the current Herdr session
rename_workspace = "prefix+$"   # Tmux equivalent of rename-session

# Agents
previous_agent = "alt+p"    # Mirrors prefix+p tab cycling
next_agent = "alt+n"        # Mirrors prefix+p tab cycling
focus_agent = "alt+1..9"    # Jump directly to agents 1-9

# General utilities
edit_scrollback = "prefix+e"
goto = "prefix+g"
help = "prefix+?"                # Show keybindings
reload_config = "prefix+shift+r" # Reload config
toggle_sidebar = "prefix+b"      # Toggle sidebar visibility

### Plugin keybindings
#
# Session/workspace chooser
#
[[keys.command]]
key = "ctrl+f"
type = "plugin_action"
command = "sessionizer.pick"
description = "choose workspace"
#
# vim-herdr-navigation:
#
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
